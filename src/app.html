<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Applied before first paint so the app never flashes the wrong theme.
      // A single data-theme attribute drives every colour token in app.css, which
      // is why no component ever needs Tailwind's dark: variant.
      try {
        const stored = localStorage.getItem('drawbridge:theme');
        const theme =
          stored ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      } catch {
        // localStorage can throw in a locked-down browser profile. Light is fine.
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
